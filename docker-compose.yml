services:
  db:
    image: postgres:15
    container_name: portiq-db
    environment:
      POSTGRES_USER: portiq
      POSTGRES_PASSWORD: portiq
      POSTGRES_DB: portiq
    ports:
      - "5432:5432"
    volumes:
      - portiq-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U portiq -d portiq"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  portiq-pgdata:
