[project]
name = "portiq-api"
version = "0.1.0"
requires-python = ">=3.11"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI reads `Depends(...)`/`require_role(...)` defaults as dependency markers, not as calls.
extend-immutable-calls = ["fastapi.Depends", "app.core.deps.require_role"]

[tool.ruff.lint.per-file-ignores]
# seed_dev.py bootstraps sys.path before importing the app so `python scripts/seed_dev.py` works.
"scripts/seed_dev.py" = ["E402"]

[tool.ruff.lint.isort]
known-first-party = ["app", "tests"]

[tool.mypy]
python_version = "3.11"
files = ["app", "tests"]
check_untyped_defs = true
disallow_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true

# These ship no type information (no py.typed) and have no stub packages installed.
[[tool.mypy.overrides]]
module = ["joblib", "joblib.*", "pandas", "pandas.*", "shap", "shap.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
