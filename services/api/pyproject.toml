[project]
name = "portiq-api"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "alembic==1.20.1",
    "fastapi==0.162.0",
    "httpx==0.28.1",
    "psycopg[binary]==3.3.8",
    "pydantic==2.14.1",
    "PyJWT[crypto]==2.15.1",
    "SQLAlchemy==2.1.8",
    "uvicorn==0.54.0",
    "joblib==1.6.0",
    "numpy==2.5.4",
    "pandas==3.1.0",
    "scikit-learn==1.9.1",
    "shap==0.54.1",
]

[dependency-groups]
dev = [
    "mypy==2.4.1",
    "pytest==9.2.0",
    "pytest-cov==7.1.0",
    "ruff==0.17.4",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI reads `Depends(...)`/`require_role(...)` defaults as dependency markers, not as calls.
extend-immutable-calls = ["fastapi.Depends", "app.core.deps.require_role"]

[tool.ruff.lint.per-file-ignores]
# seed_dev.py bootstraps sys.path before importing the app so `python scripts/seed_dev.py` works.
"scripts/seed_dev.py" = ["E402"]
"scripts/manage_users.py" = ["E402"]

[tool.ruff.lint.isort]
known-first-party = ["app", "tests"]

[tool.mypy]
python_version = "3.11"
files = ["app", "tests"]
check_untyped_defs = true
disallow_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true

# These ship no type information (no py.typed) and have no stub packages installed.
[[tool.mypy.overrides]]
module = ["joblib", "joblib.*", "pandas", "pandas.*", "shap", "shap.*", "sklearn", "sklearn.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
