services:
  # The database container
  db:
    image: postgres:15
    container_name: portiq-db
    restart: always
    environment:
      POSTGRES_USER: portiq
      POSTGRES_PASSWORD: portiq
      POSTGRES_DB: portiq
    ports:
      - "5432:5432"
    volumes:
      - portiq-pgdata:/var/lib/postgresql/data
    # pg_isready ships in the postgres image, so the check belongs here (not on the API).
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U portiq -d portiq"]
      interval: 5s
      timeout: 3s
      retries: 10

  # The FastAPI container
  api:
    build:
      context: ../..
      dockerfile: services/api/Dockerfile
    restart: always
    ports:
      - "8000:8000"
    # Optional so a fresh clone starts without it (defaults = dev auth); copy .env.example to add
    # local settings such as the Supabase values.
    env_file:
      - path: .env
        required: false
    environment:
      # Points SQLAlchemy at the internal 'db' container, not localhost
      - DATABASE_URL=postgresql+psycopg://portiq:portiq@db:5432/portiq
      - APP_ENV=local
      - MODEL_PATH=/models/dwell_model_v2.joblib
    volumes:
      - ../../ml/artifacts:/models:ro
    depends_on:
      db:
        condition: service_healthy

volumes:
  portiq-pgdata:
