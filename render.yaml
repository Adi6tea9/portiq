services:
  - type: web
    name: portiq
    runtime: docker
    plan: free
    region: ohio
    rootDir: .
    dockerfilePath: services/api/Dockerfile
    dockerContext: .
    healthCheckPath: /ready
    envVars:
      - key: APP_ENV
        value: production
      - key: AUTH_MODE
        value: supabase
      - key: DATABASE_URL
        fromDatabase:
          name: portiq-db
          property: connectionString
      - key: ALLOWED_ORIGINS
        fromService:
          name: portiq-web
          type: web
          envVarKey: RENDER_EXTERNAL_URL
      - key: SUPABASE_URL
        sync: false

  - type: web
    name: portiq-web
    runtime: node
    plan: free
    region: ohio
    rootDir: apps/web
    buildCommand: env -u NODE_OPTIONS npm ci && env -u NODE_OPTIONS npm run build
    startCommand: env -u NODE_OPTIONS npm run start -- -H 0.0.0.0 -p $PORT
    envVars:
      - key: NODE_VERSION
        value: 20.19.0
      - key: NEXT_PUBLIC_USE_MOCKS
        value: "false"
      - key: NEXT_PUBLIC_API_BASE_URL
        fromService:
          name: portiq
          type: web
          envVarKey: RENDER_EXTERNAL_URL
      - key: NEXT_PUBLIC_SUPABASE_URL
        sync: false
      - key: NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY
        sync: false

databases:
  - name: portiq-db
    plan: free
    region: ohio
    databaseName: portiq
