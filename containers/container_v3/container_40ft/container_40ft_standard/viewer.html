<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PortIQ 40FT Viewer</title>
<style>
  :root { --bg: #e4e7e9; --panel: rgba(255,255,255,.88); --ink: #12261f; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font: 14px/1.4 system-ui, sans-serif; }
  canvas { display: block; }
  #ui { position: fixed; top: 12px; left: 12px; background: var(--panel); padding: 10px 12px; border-radius: 8px; }
  #ui label { display: block; cursor: pointer; }
  #status { position: fixed; bottom: 10px; left: 12px; font-size: 12px; opacity: .75; }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
  "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
} }
</script>
</head>
<body>
<div id="ui"><strong>Visibility</strong></div>
<div id="status">Loading container_40ft_standard.glb...</div>
<script type="module">
// Serve this folder over HTTP (e.g. `python -m http.server`) and open /viewer.html.
import * as THREE from "three";
import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";
import { RoomEnvironment } from "three/addons/environments/RoomEnvironment.js";

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.AgXToneMapping;
renderer.shadowMap.enabled = true;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xe4e7e9);
scene.environment = new THREE.PMREMGenerator(renderer).fromScene(new RoomEnvironment(), 0.04).texture;
const sun = new THREE.DirectionalLight(0xffffff, 1.6);
sun.position.set(-6, 9, -7);
scene.add(sun);

const camera = new THREE.PerspectiveCamera(35, innerWidth / innerHeight, 0.05, 200);
camera.position.set(-11, 4.5, -9);
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(5.0, 1.0, 1.0);
controls.enableDamping = true;
window.__viewer = { camera, controls };   // console hook for framing checks

const toggles = {
  "Left side wall": ["Left_Side_Wall", "Exterior_Marking_Side_Left", "Exterior_Marking_Owner_Left"],
  "Right side wall": ["Right_Side_Wall", "Exterior_Marking_Side_Right", "Exterior_Marking_Owner_Right"],
  "Roof": ["Roof_Panel"],
  "Exterior markings": ["Exterior_Marking_Decals"],
  "Door markings + CSC": ["Door_Marking_Decals", "CSC_Plate"],
};

new GLTFLoader().load("container_40ft_standard.glb", (gltf) => {
  const root = gltf.scene;
  scene.add(root);
  const report = { meshes: [], materials: new Set(), missingTextures: [] };
  root.traverse((o) => {
    if (!o.isMesh) return;
    report.meshes.push(o.name);
    for (const m of [].concat(o.material)) {
      report.materials.add(m.name);
      for (const k of ["map", "normalMap", "roughnessMap", "metalnessMap", "aoMap"]) {
        if (m[k] && !m[k].image) report.missingTextures.push(`${m.name}.${k}`);
      }
      if (m.map) m.map.anisotropy = renderer.capabilities.getMaxAnisotropy();
    }
  });
  const box = new THREE.Box3().setFromObject(root);
  const size = box.getSize(new THREE.Vector3());
  window.__viewerReport = { ok: true, meshCount: report.meshes.length, meshes: report.meshes,
    materials: [...report.materials], missingTextures: report.missingTextures,
    bboxMin: box.min.toArray(), bboxMax: box.max.toArray(), size: size.toArray() };
  console.log("VIEWER_REPORT", JSON.stringify(window.__viewerReport));
  document.getElementById("status").textContent =
    `${report.meshes.length} meshes · ${report.materials.size} materials · bounds ${size.toArray().map(v => v.toFixed(3)).join(" × ")} m`;

  const ui = document.getElementById("ui");
  for (const [label, names] of Object.entries(toggles)) {
    const el = document.createElement("label");
    el.innerHTML = `<input type="checkbox" checked> ${label}`;
    el.firstChild.addEventListener("change", (e) => names.forEach((n) => {
      const o = root.getObjectByName(n);
      if (o) o.visible = e.target.checked;
    }));
    ui.appendChild(el);
  }
}, undefined, (err) => {
  window.__viewerReport = { ok: false, error: String(err) };
  document.getElementById("status").textContent = "Failed to load: " + err;
  console.error(err);
});

addEventListener("resize", () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
renderer.setAnimationLoop(() => { controls.update(); renderer.render(scene, camera); });
</script>
</body>
</html>
